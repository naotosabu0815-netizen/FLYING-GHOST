<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLYING GHOST</title>
<style>
:root{--bg:#070d1a;--teal:#12b5b0;--tx:#eaf6ff;--card:rgba(20,30,50,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1a;--teal:#12b5b0;--tx:#eaf6ff;--card:rgba(20,30,50,.88)}}
:root[data-theme="dark"]{--bg:#070d1a;--teal:#12b5b0;--tx:#eaf6ff;--card:rgba(20,30,50,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.ttl{background:var(--teal);padding:4px 14px;font-weight:800;letter-spacing:1px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
#dots span{display:inline-block;width:22px;height:22px;border-radius:50%;margin-left:5px;background:#555;border:2px solid #fff}
#dots span.on{background:#f5d020}#dots span.hit{background:var(--teal)}
#sc{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 52px);font-size:15px;text-shadow:0 1px 4px #000}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:14px;text-shadow:0 1px 4px #000;pointer-events:none}
#pw{position:fixed;right:14px;bottom:80px;width:14px;height:140px;border:2px solid #fff;border-radius:8px;overflow:hidden;display:none}
#pw i{position:absolute;bottom:0;left:0;right:0;background:var(--teal);height:0}
#pop{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:40px;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .3s,transform .5s}
#gd{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);background:var(--card);color:var(--tx);border:1px solid var(--teal);border-radius:16px;padding:6px 12px;font-size:12px}
#vw{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);background:var(--card);color:var(--tx);border:1px solid var(--teal);border-radius:16px;padding:6px 12px;font-size:12px}
#res{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px}
#res .c{background:var(--card);border:2px solid var(--teal);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center}
#res h2{margin:0 0 4px;font-size:15px;color:var(--teal)}#res .n{font-size:30px;font-weight:900;margin:4px 0 12px}
#res ul{list-style:none;padding:0;margin:0 0 16px;text-align:left}#res li{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;margin-bottom:6px}
#res button{background:var(--teal);color:#fff;border:0;border-radius:24px;padding:12px 28px;font-size:16px;font-weight:700}
</style>
</head>

for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),t=(y+1)/2;let X=x*(.24+.10*(1-t)),Y=Math.max(y,-.62)*.36,Z=z*(.20+.03*(1-t));
if(Y<-.15){const w=Math.min(1,(-.15-Y)/.07);Y-=.03*w*(.5+.5*Math.cos(X*2*Math.PI/.17))}p.setXYZ(i,X,Y,Z)}
g.computeVertexNormals();return g})();
const MG=(()=>{const sh=new THREE.Shape();[[-.1,.05],[-.05,.03],[0,.05],[.05,.03],[.1,.05],[.09,0],[.06,.012],[.035,-.025],[0,.005],[-.035,-.025],[-.06,.012],[-.09,0]].forEach(([x,y],i)=>i?sh.lineTo(x,y-.02):sh.moveTo(x,y-.02));
const g=new THREE.ExtrudeGeometry(sh,{depth:.014,bevelEnabled:false});return g})();
const TG=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-.02,.28,0),new THREE.Vector3(0,.4,0),new THREE.Vector3(.05,.45,0),new THREE.Vector3(.11,.45,0)]),16,.035,8);
const NT=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#f2f2f2';x.fillRect(0,0,256,256);
for(let i=0;i<9000;i++){const px=Math.random()*256,py=Math.random()*256,a=Math.random()*6.28,l=1.5+Math.random()*2.5;x.strokeStyle=Math.random()<.5?'rgba(0,0,0,.10)':'rgba(255,255,255,.35)';x.lineWidth=.7;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,7);return t})();

const MC={},SC={};
function pm(c){if(MC[c])return MC[c];const m=new THREE.MeshStandardMaterial({color:c,roughness:1});
m.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <dithering_fragment>','#include <dithering_fragment>\n{float f=pow(1.0-abs(dot(normalize(vNormal),normalize(vViewPosition))),2.0);gl_FragColor.rgb+=(diffuse*.6+vec3(.1))*f*.5;}')};return MC[c]=m}
const SEAM=(()=>{const P=[],wx=y=>.24+.10*(1-(y+1)/2),pt=(y,sg)=>new THREE.Vector3(sg*wx(y)*Math.sqrt(Math.max(0,1-y*y))*1.005,y*.36,0);
for(let i=0;i<30;i++)P.push(pt(-.62+i*1.62/30,1));for(let i=30;i>=0;i--)P.push(pt(-.62+i*1.62/30,-1));
const bx=wx(-.62)*Math.sqrt(1-.62*.62);for(let i=1;i<24;i++){const X=-bx+2*bx*i/24;P.push(new THREE.Vector3(X,-.223-.03*(.5+.5*Math.cos(X*2*Math.PI/.17)),0))}
return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(P,true),260,.007,5,true)})();
function ghost(c){const g=new THREE.Group(),m=pm(c);
g.add(new THREE.Mesh(GB,m));
if(!SC[c])SC[c]=new THREE.MeshStandardMaterial({color:new THREE.Color(c).multiplyScalar(.7),roughness:1});
g.add(new THREE.Mesh(SEAM,SC[c]));
const add=(geo,x,y,z,sx,sy,sz,rz=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.rotation.z=rz;g.add(o);return o};
add(SG,-.35,-.04,.07,.11,.09,.08,.3);add(SG,.35,-.04,.07,.11,.09,.08,-.3);
const tf=new THREE.Mesh(TG,m);tf.scale.z=.8;g.add(tf);add(SG,.11,.45,0,.04,.04,.03);
[-1,1].forEach(s=>add(SG,s*.075,.14,surfZ(s*.075,.14)-.003,.032,.058,.014).material=WM);
const mo=new THREE.Mesh(MG,WM);mo.position.set(0,.0,surfZ(0,0)-.006);g.add(mo);
return g}
const fallen=[],CGX=[-1.23,1.2];
const bobs=[];
// state
const COL=[0xf2c200,0xe0141c,0x1450d0];let idx=0,hits=0,phase='ready',fl=null,cur=null,guide=true,res=[];
const GP=new THREE.Vector3(0,2.14,3.6);
const gl=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x66ffee,transparent:true,opacity:.7}));gl.visible=false;gl.frustumCulled=false;scene.add(gl);
function hud(){$('#dots').innerHTML=[0,1,2].map(i=>`<span class="${res[i]===1?'hit':i>=idx?'on':''}"></span>`).join('');$('#sc').textContent='GET: '+hits+' / 3'}
function pop(t){const p=$('#pop');p.textContent=t;p.style.opacity=1;p.style.transform='translateY(-20px)';setTimeout(()=>{p.style.opacity=0;p.style.transform=''},900)}
function spawn(){if(idx>=3)return result();cur=ghost(COL[idx]);cur.position.copy(GP);cur.scale.setScalar(.55);scene.add(cur);phase='ready';hud()}
function vel(dx,dy,H){const p=Math.min(dy/(.4*H),1.4),k=dx/(.4*H);return {p,v:new THREE.Vector3(k*3,2+5*p,-(7+8*p))}}
function guideLine(v){const pts=[];let p=GP.clone(),w=v.clone();for(let i=0;i<22;i++){pts.push(p.clone());w.y-=9.8*.04;p.addScaledVector(w,.04);if(p.z<-3.65)break}gl.geometry.setFromPoints(pts);gl.visible=guide}
let dn=null;
addEventListener('pointerdown',e=>{if(phase!=='ready'||vi!==0||e.target.closest('button'))return;dn={x:e.clientX,y:e.clientY};$('#pw').style.display='block'});
addEventListener('pointermove',e=>{if(!dn)return;const o=vel(e.clientX-dn.x,dn.y-e.clientY,innerHeight);$('#pw i').style.height=Math.max(0,Math.min(100,o.p*70))+'%';if(e.clientY<dn.y)guideLine(o.v);else gl.visible=false});
addEventListener('pointerup',e=>{if(!dn)return;const d=dn;dn=null;$('#pw').style.display='none';gl.visible=false;const dy=d.y-e.clientY;if(dy<30||phase!=='ready')return;
const o=vel(e.clientX-d.x,dy,innerHeight);fl={m:cur,v:o.v,t:0,state:'fly',ct:0};phase='fly';$('#hint').style.opacity=0});
function finish(){const c=fl.state==='caught';res[idx]=c?1:0;if(!c)pop('おしい…');if(!c)scene.remove(fl.m);fl=null;idx++;hud();setTimeout(spawn,300)}
function step(dt){fallen.forEach(d=>{d.rotation.z*=Math.exp(-dt*4);d.rotation.x*=Math.exp(-dt*4);const fy=BT+.38;d.userData.vy-=9.8*dt;d.position.y+=d.userData.vy*dt;if(d.position.y<fy){d.position.y=fy;d.userData.vy=Math.abs(d.userData.vy)>.8?-d.userData.vy*.35:0}});if(!fl)return;const m=fl.m,pv=m.position.z;fl.t+=dt;if(fl.drop){fl.ct+=dt;if(fl.ct>1.1)return finish();return}
if(fl.state!=='caught'){fl.v.y-=9.8*dt}
m.position.addScaledVector(fl.v,dt);if(fl.state==='caught'){const k=Math.min(1,dt*14);m.position.x+=(fl.hx-m.position.x)*k;m.position.y+=(fl.hy-m.position.y)*k}if(fl.state!=='caught')m.rotation.z+=dt*1.5*(fl.v.x>=0?-1:1);
const r=.28,pl=BZ+r;
if(fl.state==='fly'&&pv>pl&&m.position.z<=pl){const x=m.position.x,y=m.position.y;
 const h=HOLES.findIndex(([hx,hy])=>Math.hypot(x-hx,y-hy)<HR-.12);
 if(h>=0){fl.state='caught';fl.h=h;hits++;m.position.z=pl;fl.v.set(0,0,-4);fl.hx=HOLES[h][0];fl.hy=HOLES[h][1];pop('GET！');hud();scene.children.forEach(o=>{if(o.userData.hole)o.scale.setScalar(1.3);setTimeout(()=>o.scale.setScalar(1),300)})}
 else if(Math.abs(x)<2.1&&y>BT&&y<BT+BH){fl.state='bounce';m.position.z=pl;fl.v.z=-fl.v.z*.25;fl.v.x*=.5}}
if(fl.state==='caught'&&!fl.drop&&m.position.z<BZ-.1){fl.drop=1;m.position.set(CGX[fl.h]+(Math.random()-.5)*.16,BT+.8,BZ+.4+(Math.random()-.5)*.16);m.userData.vy=0;fallen.push(m)}
const fy=(Math.abs(m.position.x)<2.5&&m.position.z<.75&&m.position.z>-4.45)?BT+.28:.28;if(m.position.y<fy&&fl.state!=='caught'){m.position.y=fy;fl.v.y=Math.abs(fl.v.y)*.35;fl.v.x*=.7;fl.v.z*=.7}
if(fl.t>2.2&&fl.state!=='caught')finish()}
function result(){phase='done';const L=[['ステッカー（全2種）',['ステッカーA','ステッカーB']]],rn=a=>a[Math.random()*a.length|0];
const s=rn(['ステッカーA','ステッカーB']),seal=rn(['ランダムシール1','ランダムシール2']);
const items=[`ステッカー：${s}`];
if(hits==1)items.push('缶バッジ：'+rn(['イエロー','ブルー','レッド','キャラA','キャラB']),'ランダムシール：'+seal);
if(hits==2)items.push('アクリルスタンド（全1種）','ランダムシール：'+seal);
if(hits==3)items.push('ポーチ（全1種）','ランダムシール：'+seal);
$('#rn').textContent=hits+'体ゲット！';$('#rl').innerHTML=items.map(t=>`<li>${t}</li>`).join('');$('#res').style.display='flex'}
$('#again').onclick=()=>{fallen.forEach(f=>scene.remove(f));fallen.length=0;$('#res').style.display='none';idx=0;hits=0;res=[];$('#hint').style.opacity=1;spawn()};
$('#vw').onclick=()=>{vi=(vi+1)%VIEWS.length;$('#vw').textContent='視点: '+VIEWS[vi].n;$('#hint').style.opacity=vi?0:1};
$('#gd').onclick=e=>{guide=!guide;e.target.textContent='ガイド: '+(guide?'ON':'OFF')};
let last=performance.now();
(function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;
 bobs.forEach((g,i)=>{g.position.y+=Math.sin(n/500+i*2)*.002;g.rotation.z=Math.sin(n/700+i)*.1});
 if(cur&&phase==='ready'){cur.position.y=GP.y+Math.sin(n/400)*.05;cur.rotation.z=0}
 step(dt);{const V=VIEWS[vi];cp.lerp(new THREE.Vector3(...V.p),.07);cl.lerp(new THREE.Vector3(...V.l),.07);cam.position.copy(cp);cam.lookAt(cl)}ren.render(scene,cam);requestAnimationFrame(loop)})(last);
hud();spawn();
</script>
</body>
